[workspace]
members = ["crates/domain", "crates/identity", "crates/persistence", "crates/api", "crates/worker", "crates/ledger", "crates/dispatch", "crates/stripe-sandbox", "crates/stripe-webhook", "crates/evidence", "crates/notifications", "crates/telemetry", "crates/observability"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
apl-domain = { path = "crates/domain" }
apl-persistence = { path = "crates/persistence" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = "9.3"
base64 = "0.22"
