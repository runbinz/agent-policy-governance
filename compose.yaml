services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apl_admin
      POSTGRES_PASSWORD: local_admin_only
      POSTGRES_DB: apl_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apl_admin -d apl_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
