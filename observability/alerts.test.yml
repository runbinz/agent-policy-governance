    interval: "1m"
    input_series: []
    alert_rule_test:
      -
        eval_time: "12m"
        alertname: "APLBusinessCollectorDown"
        exp_alerts:
          -
            exp_labels:
              severity: "warning"
            exp_annotations:
              summary: "Business metrics collector is failing or absent."
      -
