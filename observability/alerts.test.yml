rule_files:
  - "alerts.yml"
evaluation_interval: "1m"
tests:
  -
    name: "healthy collectors and zero traffic"
    interval: "1m"
    input_series:
      -
        series: "apl_business_collector_up{instance=\"a\"}"
        values: "1+0x20"
      -
        series: "apl_business_sample_timestamp_seconds{instance=\"a\"}"
        values: "0+60x20"
      -
        series: "apl_unknown_outcomes{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_manual_review{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_pending_approvals{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_ready_jobs{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_notification_failures{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_unknown_age_records{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_oldest_unresolved_age_seconds{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_oldest_approval_age_seconds{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_oldest_ready_lag_seconds{instance=\"a\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"execute\",outcome=\"succeeded\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"execute\",outcome=\"unknown\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"execute\",outcome=\"timeout\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"execute\",outcome=\"failed_confirmed\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"reconcile\",outcome=\"succeeded\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"reconcile\",outcome=\"unknown\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"reconcile\",outcome=\"timeout\"}"
        values: "0+0x20"
      -
        series: "apl_provider_calls_total{operation=\"reconcile\",outcome=\"failed_confirmed\"}"
        values: "0+0x20"
      -
        series: "apl_internal_dispatch_duration_seconds_bucket{le=\"0.1\"}"
        values: "0+0x20"
      -
        series: "apl_internal_dispatch_duration_seconds_bucket{le=\"1\"}"
        values: "0+0x20"
      -
        series: "apl_internal_dispatch_duration_seconds_bucket{le=\"+Inf\"}"
        values: "0+0x20"
      -
        series: "apl_internal_dispatch_duration_seconds_count"
        values: "0+0x20"
    alert_rule_test:
      -
        eval_time: "12m"
        alertname: "APLBusinessCollectorDown"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLBusinessSnapshotStale"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLUnresolvedBacklogAge"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLApprovalBacklogAge"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLReadyQueueLag"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLNotificationFailures"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLUnknownAgeRecords"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLProviderIndeterminateFraction"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLReconcileIndeterminateFraction"
        exp_alerts: []
      -
        eval_time: "12m"
        alertname: "APLInternalDispatchP95"
        exp_alerts: []
